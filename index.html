<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PF.tv</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── THÈMES ───────────────────────────────────────────────────────────────── */
    :root[data-theme="dark"] {
      --bg:                 #111110;
      --surface:            #1c1c1b;
      --border:             #2d2d2b;
      --text:               #e9e8e4;
      --text-secondary:     #8a8a85;
      --accent:             #a07af5;
      --accent-surface:     #1e1830;
      --accent-border:      #3d2b6b;
      --callout-tip-bg:     #1f1a07;
      --callout-tip-border: #4a3a08;
      --callout-tip-text:   #c9a93a;
      --callout-info-bg:    #0f1520;
      --callout-info-border:#1e3a5f;
      --callout-info-text:  #6db5f5;
    }

    :root[data-theme="light"] {
      --bg:                 #ffffff;
      --surface:            #f7f6f3;
      --border:             #e9e9e7;
      --text:               #37352f;
      --text-secondary:     #787774;
      --accent:             #7048d4;
      --accent-surface:     #f0eafa;
      --accent-border:      #c9b5f0;
      --callout-tip-bg:     #fffbeb;
      --callout-tip-border: #f5e07a;
      --callout-tip-text:   #6b5a00;
      --callout-info-bg:    #eef4fb;
      --callout-info-border:#c7dcf5;
      --callout-info-text:  #1a5fa0;
    }

    /* ── RESET ────────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100dvh;
      transition: background 0.2s, color 0.2s;
    }

    /* ── TOGGLE THÈME ─────────────────────────────────────────────────────────── */
    .theme-toggle {
      position: fixed;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      z-index: 100;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .theme-toggle:hover { border-color: var(--text-secondary); }

    /* ── ÉCRANS ───────────────────────────────────────────────────────────────── */
    .screen {
      display: none;
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 16px 80px;
      animation: fadeIn 0.2s ease;
    }
    .screen.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 600px) {
      .screen { padding: 48px 24px 80px; }
    }

    /* ── BACK LINK ────────────────────────────────────────────────────────────── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0;
      margin-bottom: 28px;
      text-decoration: none;
    }
    .back-link:hover { color: var(--text); }

    /* ── PAGE HEADER ──────────────────────────────────────────────────────────── */
    .page-header { margin-bottom: 28px; }
    .page-header h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
      line-height: 1.2;
    }
    .page-header p { color: var(--text-secondary); font-size: 15px; }

    /* ── PROGRESS INDICATOR ───────────────────────────────────────────────────── */
    .progress {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .progress-dots { display: flex; gap: 6px; }
    .progress-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.2s;
    }
    .progress-dot.active { background: var(--accent); }
    .progress-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }

    /* ── COMPOSANTS (styles partagés — remplis aux incréments suivants) ─────────── */

    /* cards */
    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      font-family: inherit;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
      text-decoration: none;
    }
    .card:hover { border-color: var(--accent-border); background: var(--accent-surface); }
    .card .card-icon {
      width: 44px; height: 44px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .card .card-body { flex: 1; }
    .card .card-body strong { display: block; font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .card .card-body span { font-size: 13px; color: var(--text-secondary); }
    .card .chevron { color: var(--text-secondary); flex-shrink: 0; }

    /* steps */
    .steps { display: flex; flex-direction: column; gap: 10px; }
    .step {
      display: flex; gap: 14px; align-items: flex-start;
      padding: 16px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px;
    }
    .step-num {
      width: 24px; height: 24px;
      background: var(--accent); color: var(--bg);
      border-radius: 50%; font-size: 12px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .step-content { flex: 1; min-width: 0; }
    .step-content strong { display: block; font-weight: 500; font-size: 15px; margin-bottom: 2px; }
    .step-content p { font-size: 14px; color: var(--text-secondary); margin-top: 2px; }
    .step-content em { font-size: 13px; color: var(--text-secondary); font-style: italic; display: block; margin-top: 4px; }

    /* url copy row */
    .url-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .url-block {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 9px 12px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px; color: var(--text); word-break: break-all;
    }
    .copy-btn {
      flex-shrink: 0; background: var(--accent); color: var(--bg);
      border: none; border-radius: 6px; padding: 9px 12px;
      font-size: 12px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: opacity 0.15s; white-space: nowrap;
      min-width: 44px; min-height: 44px; display: flex; align-items: center;
    }
    .copy-btn:hover { opacity: 0.85; }
    .copy-btn.copied { background: #3a9e5f; color: #fff; }

    /* store link */
    .store-link {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border);
      text-decoration: none; padding: 10px 16px;
      border-radius: 8px; font-size: 13px; font-weight: 500;
      margin-top: 10px; transition: border-color 0.15s;
      min-height: 44px;
    }
    .store-link:hover { border-color: var(--accent); }

    /* help inline */
    .help-inline {
      font-size: 13px; color: var(--text-secondary);
      font-style: italic; margin-top: 6px; display: block;
    }

    /* callout */
    .callout {
      display: flex; gap: 12px; border-radius: 10px;
      padding: 14px 16px; font-size: 14px; margin-top: 16px; line-height: 1.5;
    }
    .callout.tip {
      background: var(--callout-tip-bg);
      border: 1px solid var(--callout-tip-border);
      color: var(--callout-tip-text);
    }
    .callout.info {
      background: var(--callout-info-bg);
      border: 1px solid var(--callout-info-border);
      color: var(--callout-info-text);
    }
    .callout .ci { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

    /* tip items */
    .tip-sections { display: flex; flex-direction: column; gap: 32px; }
    .tip-section h3 {
      font-size: 16px; font-weight: 600; margin-bottom: 12px;
      color: var(--text);
    }
    .tip-list { display: flex; flex-direction: column; gap: 8px; }
    .tip-item {
      padding: 14px 16px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px;
    }
    .tip-item strong { display: block; font-weight: 500; font-size: 15px; margin-bottom: 3px; }
    .tip-item p { font-size: 14px; color: var(--text-secondary); }

    /* diff items */
    .diff-list { display: flex; flex-direction: column; gap: 8px; }
    .diff-item {
      display: flex; gap: 14px; align-items: flex-start;
      padding: 14px 16px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px;
    }
    .diff-icon { font-size: 18px; flex-shrink: 0; }
    .diff-body { flex: 1; }
    .diff-body strong { display: block; font-weight: 500; font-size: 15px; margin-bottom: 2px; }
    .diff-body p { font-size: 14px; color: var(--text-secondary); }

    /* cta-next */
    .cta-next {
      display: flex; align-items: center; justify-content: center;
      background: var(--accent); color: var(--bg);
      border: none; border-radius: 10px;
      padding: 16px 24px; font-size: 15px; font-weight: 600;
      font-family: inherit; cursor: pointer; text-decoration: none;
      width: 100%; transition: opacity 0.15s;
      min-height: 52px;
    }
    .cta-next:hover { opacity: 0.88; }
    .cta-next-secondary {
      display: block; text-align: center;
      font-size: 14px; color: var(--text-secondary);
      text-decoration: none; margin-top: 14px;
    }
    .cta-next-secondary:hover { color: var(--text); }

    /* signature */
    .signature {
      text-align: center; padding: 28px 0 0;
      font-size: 16px; font-weight: 500;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
      margin-top: 32px;
    }

    /* cta-primary (home) */
    .cta-primary {
      display: flex; align-items: center; justify-content: center;
      background: var(--accent); color: var(--bg);
      border: none; border-radius: 10px;
      padding: 18px 24px; font-size: 16px; font-weight: 600;
      font-family: inherit; cursor: pointer; text-decoration: none;
      width: 100%; transition: opacity 0.15s;
      min-height: 56px; margin-bottom: 20px;
    }
    .cta-primary:hover { opacity: 0.88; }

    /* home header */
    .home-header { padding: 48px 0 32px; }
    .home-logo { font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 20px; }
    .home-header h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 6px; }
    .home-header p { color: var(--text-secondary); font-size: 15px; }

    /* cards grid */
    .cards-grid { display: flex; flex-direction: column; gap: 10px; }

    /* footer link */
    .footer-link {
      display: block; text-align: center; margin-top: 28px;
      font-size: 14px; color: var(--text-secondary); text-decoration: none;
    }
    .footer-link:hover { color: var(--text); }

    /* divider */
    .divider { height: 1px; background: var(--border); margin: 28px 0; }

    /* intro text (avant les steps) */
    .guide-intro { font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.6; }
  </style>
</head>
<body>

  <button class="theme-toggle" id="theme-toggle" aria-label="Changer le thème">☀️</button>

  <!-- ── HOME ──────────────────────────────────────────────────────────────── -->
  <div id="screen-home" class="screen active">
    <div class="home-header">
      <div class="home-logo">PF.tv</div>
      <h1>Bienvenue</h1>
      <p>Par quoi tu veux commencer ?</p>
    </div>
    <!-- contenu — incrément 2 -->
  </div>

  <!-- ── INSTALL PICKER ─────────────────────────────────────────────────────── -->
  <div id="screen-install-picker" class="screen">
    <a class="back-link" href="#home">← Retour</a>
    <div id="picker-progress"></div>
    <!-- contenu — incrément 3 -->
  </div>

  <!-- ── INSTALL GUIDE ──────────────────────────────────────────────────────── -->
  <div id="screen-install-guide" class="screen">
    <a class="back-link" href="#install">← Choisir un autre appareil</a>
    <div id="guide-progress"></div>
    <div id="guide-content"></div>
  </div>

  <!-- ── TIPS ───────────────────────────────────────────────────────────────── -->
  <div id="screen-tips" class="screen">
    <a class="back-link" href="#home">← Retour à l'accueil</a>
    <div id="tips-progress"></div>
    <!-- contenu — incrément 4 -->
  </div>

  <!-- ── ADVANCED ───────────────────────────────────────────────────────────── -->
  <div id="screen-advanced" class="screen">
    <a class="back-link" href="#home">← Retour à l'accueil</a>
    <!-- contenu — incrément 4 -->
  </div>

  <!-- ── REQUEST ────────────────────────────────────────────────────────────── -->
  <div id="screen-request" class="screen">
    <a class="back-link" href="#home">← Retour à l'accueil</a>
    <!-- contenu — incrément 5 -->
  </div>

  <script>
    // ─── CONFIG ────────────────────────────────────────────────────────────────
    const CONFIG = {
      serverUrl: "https://melozy.ismene.usbx.me/jellyfin",
      storeLinks: {
        streamyfinIOS:     "https://apps.apple.com/app/streamyfin/id6593660679",
        streamyfinAndroid: "https://play.google.com/store/apps/details?id=com.fredrikburmester.streamyfin",
        swiftfinAppleTV:   "https://apps.apple.com/app/swiftfin/id1604098728"
      },
      contact: {
        method: "[à compléter — SMS / WhatsApp / Signal]",
        handle: "[à compléter]"
      },
      strings: {
        helpInline:   "Pas retrouvé tes identifiants ? Contacte-moi, je te les renvoie.",
        copyBtn:      "Copier",
        copiedBtn:    "Copié ✓",
        signature:    "Bon film ou épisode 👌",
        ctaGuided:    "Tes premiers réflexes →",
        ctaDirect:    "← Retour à l'accueil",
        ctaDirectSub: "Voir tes premiers réflexes →"
      }
    };

    // ─── ÉTAT SESSION ──────────────────────────────────────────────────────────
    let guidedMode = false;

    // ─── THÈME ─────────────────────────────────────────────────────────────────
    const html    = document.documentElement;
    const themeBtn = document.getElementById('theme-toggle');

    function applyTheme(theme) {
      html.dataset.theme = theme;
      themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('pftv-theme', theme);
    }

    themeBtn.addEventListener('click', () => {
      applyTheme(html.dataset.theme === 'dark' ? 'light' : 'dark');
    });

    applyTheme(localStorage.getItem('pftv-theme') || 'dark');

    // ─── ROUTER ────────────────────────────────────────────────────────────────
    function parseHash() {
      const raw = window.location.hash.slice(1) || 'home';
      const [segment, param] = raw.split('/');

      if (segment === 'start') {
        guidedMode = true;
        return { screen: 'install-picker' };
      }
      if (segment === 'install' && param) return { screen: 'install-guide', device: param };
      if (segment === 'install')          return { screen: 'install-picker' };
      return { screen: segment };
    }

    function renderProgress(containerId, step) {
      const el = document.getElementById(containerId);
      if (!el) return;
      if (!guidedMode) { el.innerHTML = ''; return; }
      el.innerHTML = `
        <div class="progress">
          <div class="progress-dots">
            <div class="progress-dot ${step >= 1 ? 'active' : ''}"></div>
            <div class="progress-dot ${step >= 2 ? 'active' : ''}"></div>
            <div class="progress-dot ${step >= 3 ? 'active' : ''}"></div>
          </div>
          <span class="progress-label">Étape ${step} sur 3</span>
        </div>`;
    }

    function route() {
      const { screen, device } = parseHash();

      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

      const el = document.getElementById('screen-' + screen);
      if (!el) {
        document.getElementById('screen-home').classList.add('active');
        return;
      }
      el.classList.add('active');
      window.scrollTo(0, 0);

      if (screen === 'install-picker') renderProgress('picker-progress', 1);
      if (screen === 'install-guide')  renderProgress('guide-progress', 2);
      if (screen === 'tips')           renderProgress('tips-progress', 3);
      if (screen === 'home')           guidedMode = false;

      if (screen === 'install-guide' && device) renderGuide(device);
    }

    window.addEventListener('hashchange', route);

    // ─── PLACEHOLDER renderGuide (rempli à l'incrément 3) ─────────────────────
    function renderGuide(device) {
      document.getElementById('guide-content').innerHTML =
        `<p style="color:var(--text-secondary);font-size:14px">Guide pour <strong>${device}</strong> — incrément 3</p>`;
    }

    route();
  </script>

</body>
</html>
